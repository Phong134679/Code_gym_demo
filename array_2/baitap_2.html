<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đảo ngược mảng</title>
</head>
<body>


<script>
    let arrays = ['c', 's', 'c', '2', '6', '1'];

    let result = "";

    for (let i = 0; i < arrays.length; i++) {
        result += arrays[arrays.length - 1 - i];
    }

    console.log("Mảng ban đầu:", arrays);
    console.log("Sau khi đảo ngược:", result);
</script>

</body>
</html>
