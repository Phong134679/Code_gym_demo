<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bai 4</title>
</head>
<body>
<button id = "button" onclick="swapArray()">lick me</button>
<script>
    let arr = [];
    let n;
    for (let i = 0; i < 11; i++) {
        n = Math.floor((Math.random() * 21));
        arr.push(n);
    }
    console.log(arr);

    function swapArray() {
        for (let i = 0; i < Math.floor(arr.length/2); i++) {
            let temp = arr[i];
            arr[i] = arr[arr.length - 1 - i];
            arr[arr.length - 1 - i] = temp;
        }
        console.log(arr);
    }
</script>
</body>
