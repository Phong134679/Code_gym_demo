<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tăng giá trị lên 1</title>
</head>
<body>

<script>
    function increaseNumber(num) {
        return num + 1;
    }

    let inputNumber = Number(prompt("Nhập một số:"));
    let result = increaseNumber(inputNumber);

    document.write("Giá trị sau khi tăng là: " + result);
</script>

</body>
</html>
