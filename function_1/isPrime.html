<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kiểm tra số nguyên tố</title>
</head>
<body>

<script>
  function isPrime(n) {
    // Số nhỏ hơn 2 không phải số nguyên tố
    if (n < 2) {
      return false;
    }

    // Chỉ cần kiểm tra đến căn bậc hai của n
    for (let i = 2; i <= Math.sqrt(n); i++) {
      if (n % i === 0) {
        return false;
      }
    }

    return true;
  }

  let number = Number(prompt("Nhập một số:"));

  if (isPrime(number)) {
    alert(number + " là số nguyên tố.");
  } else {
    alert(number + " không phải là số nguyên tố.");
  }
</script>

</body>
</html>
