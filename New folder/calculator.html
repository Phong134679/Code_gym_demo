<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
</head>
<body>

<h1>Calculator</h1>

<input type="number" id="num1" placeholder="Số thứ nhất">
<input type="number" id="num2" placeholder="Số thứ hai">
<br><br>

<button onclick="add()">Addition (+)</button>
<button onclick="sub()">Subtraction (-)</button>
<button onclick="mul()">Multiplication (×)</button>
<button onclick="div()">Division (/)</button>

<p id="result">Result:</p>

<script>
  function getValues() {
    let a = parseFloat(document.getElementById("num1").value);
    let b = parseFloat(document.getElementById("num2").value);
    return [a, b];
  }

  function add() {
    let [a, b] = getValues();
    document.getElementById("result").innerText = "Result Addition: " + (a + b);
  }

  function sub() {
    let [a, b] = getValues();
    document.getElementById("result").innerText = "Result Subtraction: " + (a - b);
  }

  function mul() {
    let [a, b] = getValues();
    document.getElementById("result").innerText = "Result Multiplication: " + (a * b);
  }

  function div() {
    let [a, b] = getValues();
    if (b === 0) {
      document.getElementById("result").innerText = "Không thể chia cho 0";
    } else {
      document.getElementById("result").innerText = "Result Division: " + (a / b);
    }
  }
</script>

</body>
</html>
