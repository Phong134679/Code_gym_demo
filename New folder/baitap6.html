<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tính Hoa Hồng</title>
</head>
<body>

<h2>Quy tắc tính hoa hồng</h2>
<ul>
  <li>Dưới 10.000.000 VNĐ → 5%</li>
  <li>Từ 10.000.000 đến dưới 50.000.000 VNĐ → 10%</li>
  <li>Từ 50.000.000 đến dưới 100.000.000 VNĐ → 15%</li>
  <li>Từ 100.000.000 VNĐ trở lên → 20%</li>
</ul>

<hr>

<label>Nhập doanh thu (VNĐ):</label><br><br>
<input type="number" id="revenue" placeholder="Ví dụ: 50000000">
<br><br>

<button onclick="calculateCommission()">Tính hoa hồng</button>

<h3 id="result"></h3>

<script>
  function calculateCommission() {
    let revenue = Number(document.getElementById("revenue").value);
    let commissionRate = 0;

    if (revenue < 10000000) {
      commissionRate = 0.05;
    } else if (revenue < 50000000) {
      commissionRate = 0.10;
    } else if (revenue < 100000000) {
      commissionRate = 0.15;
    } else {
      commissionRate = 0.20;
    }

    let commission = revenue * commissionRate;

    document.getElementById("result").innerText =
            "Hoa hồng nhận được: " + commission.toLocaleString("vi-VN") + " VNĐ";
  }
</script>

</body>
</html>
