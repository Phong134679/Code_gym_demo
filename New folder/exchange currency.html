<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Currency Exchange</title>
    <style>
        .field {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }
        #result {
            color: blue;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="field">
    <label>Amount</label>
    <input type="number" id="amount" placeholder="Nhập số tiền">
</div>

<div class="field">
    <label>From Currency</label>
    <select id="from">
        <option value="VND">VND</option>
        <option value="JPY">JPY</option>
    </select>
</div>

<div class="field">
    <label>To Currency</label>
    <select id="to">
        <option value="VND">VND</option>
        <option value="JPY">JPY</option>
    </select>
</div>

<button onclick="exchange(
  document.getElementById('from').value,
  document.getElementById('to').value
)">Exchange</button>


<p id="result">Result:</p>
</body>

<script>
    const TYGIA = 0.006
    function exchange(from, to) {
        const amount = document.getElementById("amount").value;
        const result = document.getElementById("result");

        if (amount === "" || amount <= 0) {
            result.textContent = "Result: Vui lòng nhập số tiền hợp lệ";
            return;
        }

        let kq

        if (from === to) {
            kq = amount;
        } else if (from === "VND" && to === "JPY") {
            kq = amount * TYGIA;
        } else if (from === "JPY" && to === "VND") {
            kq = amount / TYGIA;
        }

        result.textContent = `Result: ${kq} ${to}`;

    }
</script>
</html>
