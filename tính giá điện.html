<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>tính giá điện</title>
</head>

<body>
<button onclick="tinhGiaDien()"> Calculate</button>
</body>

<script>
  function tinhGiaDien() {
    let soDien = parseFloat(prompt("Nhập số kWh điện tiêu thụ:"));
    let tien = 0;

    if (soDien <= 50) {
      tien = soDien * 1678;
    } else if (soDien <= 100) {
      tien = 50 * 1678 + (soDien - 50) * 1734;
    } else {
      tien = 50 * 1678 + 50 * 1734 + (soDien - 100) * 2014;
    }

    alert("Tiền điện phải trả: " + tien + " đồng");
  }


</script>
</html>
