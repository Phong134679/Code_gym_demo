<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra ký tự số</title>
</head>
<body>

<script>

    // Hàm kiểm tra dữ liệu nhập vào
    function isValidInput(value) {
        if (value === null) return false;        // Cancel
        if (value.length !== 1) return false;   // Không phải 1 ký tự duy nhất
        return true;
    }

    // Hàm kiểm tra ký tự số
    function isDigit(char) {
        if (char >= '0' && char <= '9') {
            return true;
        } else {
            return false;
        }
    }

    let input = prompt("Nhập một ký tự:");

    if (isValidInput(input)) {
        let result = isDigit(input);
        document.write("Kết quả: " + result);
    } else {
        document.write("Dữ liệu không hợp lệ. Vui lòng nhập đúng 1 ký tự.");
    }

</script>

</body>
</html>
