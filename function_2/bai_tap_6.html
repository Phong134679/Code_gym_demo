<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra số nguyên dương</title>
</head>
<body>

<script>

    // Hàm kiểm tra dữ liệu nhập có phải là số hợp lệ không
    function isValidNumber(value) {
        if (value === null) return false;        // Bấm Cancel
        if (value.trim() === "") return false;   // Chuỗi rỗng
        if (isNaN(value)) return false;          // Không phải số
        return true;
    }

    // Hàm kiểm tra số nguyên dương
    function isPositiveInteger(number) {

        // Bước 1: phải lớn hơn 0
        if (number > 0) {

            // Bước 2: chia dư cho 1 phải bằng 0
            if (number % 1 === 0) {
                return true;
            }
        }

        return false;
    }

    // Nhập dữ liệu
    let input = prompt("Nhập một số:");

    if (isValidNumber(input)) {

        let num = Number(input);
        let result = isPositiveInteger(num);

        document.write("Kết quả: " + result);

    } else {
        document.write("Dữ liệu không hợp lệ.");
    }

</script>

</body>
</html>
