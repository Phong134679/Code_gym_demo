<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>30 số chia hết cho 7</title>
</head>
<body>
  <button onclick="cal()">Try it</button>
<script>
  function cal() {
    let count = 0;
    let i = 0;
    let sum = 0;
    while (true) {
      if(count === 30) break;
      if(i % 7 === 0) {
        sum += i;
        count++;
      }
      i++;
    }
    alert(sum);
  }
</script>
</body>
</html>
