<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>kiemTraNhietDo</title>
</head>
<body>
<button onclick="kiemTraNhietDo()">Click Me</button>
<script>
  function kiemTraNhietDo() {
    let nhietDo;

    while (true) {
      nhietDo = parseFloat(prompt("Nhập nhiệt độ hiện tại:"));

      if (nhietDo > 100) {
        alert("Nhiệt độ quá cao! Hãy giảm nhiệt độ.");
      } else if (nhietDo < 20) {
        alert("Nhiệt độ quá thấp! Hãy tăng nhiệt độ.");
      } else {
        alert("Nhiệt độ ở mức bình thường.");
        break; // thoát vòng lặp khi nhiệt độ hợp lý
      }
    }
  }
</script>
</body>
</html>
