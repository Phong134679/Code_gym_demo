<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>check tam giac</title>
</head>

<body>
<button onclick="kiemTraTamGiac()"> Calculate</button>
</body>

<script>
  function kiemTraTamGiac() {
    let a = parseFloat(prompt("Nhập cạnh a:"));
    let b = parseFloat(prompt("Nhập cạnh b:"));
    let c = parseFloat(prompt("Nhập cạnh c:"));

    if (a > 0 && b > 0 && c > 0 &&
            a + b > c &&
            a + c > b &&
            b + c > a) {
      alert("a, b, c là 3 cạnh của một tam giác");
    } else {
      alert("a, b, c KHÔNG phải là 3 cạnh của một tam giác");
    }
  }

</script>
</html>
