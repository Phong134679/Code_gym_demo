<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test 3</title>
</head>
<body>
<input id="dateInput" placeholder="MM/yyyy">
<button onclick="countDays()">Lick me</button>
<script>

  function isLeapYear(year) {

    if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
      return true;
    }

    return false;
  }

  function countDays() {

    let input = document.getElementById("dateInput").value;

    let regex = /^(0[1-9]|1[0-2])\/\d{4}$/;

    if (!regex.test(input)) {
      console.log("Sai định dạng");
      return;
    }

    let parts = input.split("/");

    let month = Number(parts[0]);
    let year = Number(parts[1]);

    let days;

    if (month === 2) {

      if (isLeapYear(year)) {
        days = 29;
      } else {
        days = 28;
      }

    }

    else if ([4,6,9,11].includes(month)) {

      days = 30;

    }

    else {

      days = 31;

    }

    console.log(`Tháng ${month}/${year} có ${days} ngày`);
  }

  countDays();

</script>

</body>
</html>
