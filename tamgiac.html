<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>diện tích hình tam giac</title>
</head>

<body>
<button onclick="calculate()"> Calculate</button>
</body>

<script>
  function calculate() {
    let a = Number(prompt("Nhập cạnh a"))
    let b = Number(prompt("Nhập cạnh b"))
    if (a < 0 || isNaN(a) || a === 0 || b < 0 || isNaN(b) || b === 0) {
      alert("cạnh phải là số khác 0")
    } else {
      let square = a*b*1/2
      alert(square)
    }
  }
</script>
</html>
