<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>check age</title>
</head>

<body>
<button onclick="kiemTraTuoi()"> Calculate</button>
</body>

<script>
  function kiemTraTuoi() {
    let age = parseInt(prompt("Nhập tuổi:"));

    if (Number.isInteger(age) && age > 0 && age < 120) {
      alert(age + " là tuổi hợp lệ của một người");
    } else {
      alert(age + " không phải là tuổi hợp lệ");
    }
  }
</script>
</html>
